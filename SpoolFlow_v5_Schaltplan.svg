<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="830" viewBox="0 0 680 830" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, sans-serif">
  <title>SpoolFlow v5 Schaltplan – MW Service 3D</title>
  <desc>Übersichtsschaltplan SpoolFlow v5: ESP32 WROOM-32E verbunden mit PN5180 NFC-Reader, SSD1306 OLED und 4 Tastern</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="830" fill="#ffffff"/>

  <!-- TITLE -->
  <text font-size="15" font-weight="600" x="340" y="30" text-anchor="middle" fill="#1a1a1a">SpoolFlow v5 – Schaltplan</text>
  <text font-size="12" x="340" y="48" text-anchor="middle" fill="#555">ESP32 WROOM-32E · PN5180 · SSD1306 · 4× Taster | MW Service 3D | filament-flow.com</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- PN5180 NFC -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="30" y="70" width="180" height="185" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text font-size="14" font-weight="600" x="120" y="94" text-anchor="middle" fill="#085041">PN5180</text>
  <text font-size="12" x="120" y="110" text-anchor="middle" fill="#0F6E56">NFC Reader</text>
  <text font-size="12" x="120" y="126" text-anchor="middle" fill="#0F6E56">ISO 14443A + 15693</text>
  <text font-size="12" x="50" y="152" fill="#085041">SCK   ← GPIO 18</text>
  <text font-size="12" x="50" y="170" fill="#085041">SDO   ← GPIO 23</text>
  <text font-size="12" x="50" y="188" fill="#085041">SDI   ← GPIO 19</text>
  <text font-size="12" x="50" y="206" fill="#085041">NSS   ← GPIO 5</text>
  <text font-size="12" x="50" y="224" fill="#085041">BUSY  → GPIO 27</text>
  <text font-size="12" x="50" y="242" fill="#085041">RST   ← GPIO 16</text>

  <!-- SPI Bus Label -->
  <rect x="30" y="280" width="180" height="22" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-size="12" x="120" y="295" text-anchor="middle" fill="#04342C">SPI Bus (6 Leitungen)</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- SSD1306 OLED -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="470" y="70" width="180" height="140" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text font-size="14" font-weight="600" x="560" y="94" text-anchor="middle" fill="#042C53">SSD1306</text>
  <text font-size="12" x="560" y="110" text-anchor="middle" fill="#185FA5">OLED 128×64</text>
  <text font-size="12" x="560" y="126" text-anchor="middle" fill="#185FA5">I2C Adresse: 0x3C</text>
  <text font-size="12" x="488" y="152" fill="#0C447C">SDA   ← GPIO 21</text>
  <text font-size="12" x="488" y="170" fill="#0C447C">SCL   ← GPIO 22</text>
  <text font-size="12" x="488" y="188" fill="#0C447C">VCC   ← 3.3V</text>
  <text font-size="12" x="488" y="206" fill="#0C447C">GND   ← GND</text>

  <!-- I2C Bus Label -->
  <rect x="470" y="280" width="180" height="22" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text font-size="12" x="560" y="295" text-anchor="middle" fill="#042C53">I2C Bus (2 Leitungen)</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- ESP32 -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="230" y="310" width="220" height="200" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
  <text font-size="14" font-weight="600" x="340" y="334" text-anchor="middle" fill="#2C2C2A">ESP32</text>
  <text font-size="12" x="340" y="350" text-anchor="middle" fill="#444441">WROOM-32E</text>
  <!-- Left pins -->
  <text font-size="11" x="238" y="380" fill="#444441">GPIO 18 – SCK</text>
  <text font-size="11" x="238" y="398" fill="#444441">GPIO 23 – MOSI→SDO</text>
  <text font-size="11" x="238" y="416" fill="#444441">GPIO 19 – MISO→SDI</text>
  <text font-size="11" x="238" y="434" fill="#444441">GPIO 5  – NSS</text>
  <text font-size="11" x="238" y="452" fill="#444441">GPIO 27 – BUSY</text>
  <text font-size="11" x="238" y="470" fill="#444441">GPIO 16 – RST</text>
  <!-- Right pins -->
  <text font-size="11" x="442" y="380" text-anchor="end" fill="#444441">SDA – GPIO 21</text>
  <text font-size="11" x="442" y="398" text-anchor="end" fill="#444441">SCL – GPIO 22</text>
  <text font-size="11" x="442" y="430" text-anchor="end" fill="#444441">BTN_L – GPIO 32</text>
  <text font-size="11" x="442" y="448" text-anchor="end" fill="#444441">BTN_R – GPIO 33</text>
  <text font-size="11" x="442" y="466" text-anchor="end" fill="#444441">BTN_ADD – GPIO 25</text>
  <text font-size="11" x="442" y="484" text-anchor="end" fill="#444441">BTN_OK – GPIO 26</text>
  <!-- Power -->
  <text font-size="11" x="300" y="502" text-anchor="middle" fill="#888780">3.3V · GND</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- 4 Taster -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="470" y="560" width="180" height="165" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text font-size="14" font-weight="600" x="560" y="584" text-anchor="middle" fill="#412402">4× Taster</text>
  <text font-size="12" x="560" y="600" text-anchor="middle" fill="#854F0B">INPUT_PULLUP, gegen GND</text>
  <text font-size="12" x="488" y="630" fill="#633806">BTN_L  ◄   GPIO 32</text>
  <text font-size="12" x="488" y="650" fill="#633806">BTN_R  ►   GPIO 33</text>
  <text font-size="12" x="488" y="670" fill="#633806">BTN_ADD ✚  GPIO 25</text>
  <text font-size="12" x="488" y="690" fill="#633806">BTN_OK  ✓  GPIO 26</text>
  <text font-size="11" x="488" y="714" fill="#854F0B">alle: Pin → Taster → GND</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Stromversorgung -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="30" y="560" width="180" height="120" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text font-size="14" font-weight="600" x="120" y="584" text-anchor="middle" fill="#4A1B0C">Stromversorgung</text>
  <text font-size="12" x="50" y="614" fill="#712B13">USB (5V) → ESP32 VIN</text>
  <text font-size="12" x="50" y="634" fill="#712B13">ESP32 3.3V → PN5180</text>
  <text font-size="12" x="50" y="654" fill="#712B13">ESP32 3.3V → OLED</text>
  <text font-size="12" x="50" y="674" fill="#712B13">GND gemeinsam (alle)</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- VERBINDUNGSLINIEN -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- SPI Verbindungen PN5180 → ESP32 -->
  <line x1="210" y1="152" x2="230" y2="375" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 3"/>
  <line x1="210" y1="170" x2="230" y2="393" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 3"/>
  <line x1="210" y1="188" x2="230" y2="411" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 3"/>
  <line x1="210" y1="206" x2="230" y2="429" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 3"/>
  <line x1="210" y1="224" x2="230" y2="447" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 3"/>
  <line x1="210" y1="242" x2="230" y2="465" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 3"/>

  <!-- SPI Label → ESP32 -->
  <line x1="120" y1="302" x2="230" y2="380" stroke="#1D9E75" stroke-width="1.5" fill="none"/>

  <!-- I2C Verbindungen OLED → ESP32 -->
  <line x1="470" y1="152" x2="450" y2="375" stroke="#185FA5" stroke-width="1" stroke-dasharray="5 3"/>
  <line x1="470" y1="170" x2="450" y2="393" stroke="#185FA5" stroke-width="1" stroke-dasharray="5 3"/>

  <!-- I2C Label → ESP32 -->
  <line x1="560" y1="302" x2="450" y2="385" stroke="#378ADD" stroke-width="1.5" fill="none"/>

  <!-- Buttons → ESP32 -->
  <path d="M470 640 L450 445" stroke="#BA7517" stroke-width="1.2" stroke-dasharray="5 3" fill="none" marker-end="url(#arrow)"/>

  <!-- Power → ESP32 -->
  <path d="M120 560 L120 530 L310 530 L310 510" stroke="#993C1D" stroke-width="1.2" stroke-dasharray="5 3" fill="none" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- WARNUNG MOSI/MISO -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="30" y="745" width="620" height="64" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text font-size="13" font-weight="600" x="340" y="766" text-anchor="middle" fill="#4A1B0C">⚠  Wichtig: MOSI/MISO intentional vertauscht</text>
  <text font-size="11" x="340" y="783" text-anchor="middle" fill="#712B13">PN5180 SDI (Eingang) → GPIO 19 (MISO-Pin auf ESP32)</text>
  <text font-size="11" x="340" y="799" text-anchor="middle" fill="#712B13">PN5180 SDO (Ausgang) → GPIO 23 (MOSI-Pin auf ESP32)  ·  Hardware-bedingt, kein Fehler</text>

</svg>
